    keyStored: document.getElementById('key-stored'),
    keyScope: document.getElementById('key-scope'),
    apiKey: document.getElementById('api-key'),
    rememberKey: document.getElementById('remember-key'),
    wipeKey: document.getElementById('wipe-key'),
    run: document.getElementById('run'),
    cancel: document.getElementById('cancel'),
    storageInfo: document.getElementById('storage-info'),
    deleteCached: document.getElementById('delete-cached'),
    threadInfo: document.getElementById('thread-info'),
    threadTitle: document.getElementById('thread-title'),
    status: document.getElementById('status'),
    warnings: document.getElementById('warnings'),
    results: document.getElementById('results'),
};

let activeController = null;
let loadedThread = null;

function setStatus(text, isError) {
    elements.status.textContent = text;
    elements.status.classList.toggle('error', Boolean(isError));
}

// The slider's share of a thread's comments: the top of the thread.
// The Max cost box caps the next run: it is the budget the pipeline stops at, and it sets the slider to the
// largest share of top comments whose forecast fits. The slider can still be moved by hand afterwards; the
// budget still applies. An empty or non-positive box counts as the default, and editing it writes the default back.
const DEFAULT_MAX_COST_USD = DEFAULT_CONFIG.budgetUsd;

// A number box's value when it holds a positive number, else null; each caller applies its own fallback.
function positiveNumberInBox(element) {
    const value = Number(element.value);
    return Number.isFinite(value) && value > 0 ? value : null;
}

function maxCostInBox() {
    return positiveNumberInBox(elements.maxCost) ?? DEFAULT_MAX_COST_USD;
}

function applyMaxCostToShare() {
    if (loadedThread === null) {
        return;
    }
    elements.share.value = largestShareWithinBudget(loadedThread.comments, selectedCostRate(), maxCostInBox());
}

function sharePercent() {
    return Number(elements.share.value);
}

function selectedComments() {
    return loadedThread === null ? [] : selectedThread().comments;
}

function selectedModelKeys() {
    return { volumeKey: elements.volumeModel.value, consolidationKey: elements.consolidationModel.value };
}

function keyAvailable() {
    return currentApiKey() !== null || elements.apiKey.value.trim() !== '';
}

// The run as the page would start it now: DEFAULT_CONFIG, then the two model choices, then the Max cost box.
function selectedRunConfig() {
    const { volumeKey, consolidationKey } = selectedModelKeys();
    return { ...buildStageConfig(volumeKey, consolidationKey), budgetUsd: maxCostInBox() };
}

function selectedCostRate() {
    const { volumeKey, consolidationKey } = selectedModelKeys();
    return combinedRate(volumeKey, consolidationKey, 'costPerThousandTokensUsd');
}

// The loaded thread restricted to the selected share.
function selectedThread() {
    return threadShare(loadedThread, sharePercent());
}

function shareText(comments) {
    return `${sharePercent()}%, ${comments.length} of ${loadedThread.comments.length} comments`;
}

function isLoadedThread(threadId) {
    return loadedThread !== null && String(loadedThread.id) === threadId;
}

// An element with an optional class and text.
function makeElement(tag, { className, text } = {}) {
    const element = document.createElement(tag);
    if (className !== undefined) element.className = className;
    if (text !== undefined) element.textContent = text;
    return element;
}

// Latest-request-wins for async work that a later change supersedes: start() returns a function that
// says whether that request is still the latest; cancel() makes every pending request stale.
function makeLatest() {
    let current = 0;
    return {
        start() {
            current += 1;
            const mine = current;
            return () => mine === current;
        },
        cancel() {
            current += 1;
        },
    };
}

const probeLatest = makeLatest();
const searchLatest = makeLatest();
const listLatest = makeLatest();

// Everything derived from the two stores is cached in memory and dropped only when a store changed:
// the result cache after a run that called a model, both stores after Delete, one thread's snapshot
// after a refetch. A stored-thread load and a fully cached replay change nothing and keep the memos.
// Probes build and hash every request of a run, and the slider and the list ask for the same probe
// many times, so they are kept per thread, share, and models.
const flattenedThreads = new Map();
const probeMemo = new Map();

function probeSelection(thread) {
    const { volumeKey, consolidationKey } = selectedModelKeys();
    const key = [thread.id, thread.comments.length, volumeKey, consolidationKey].join('|');
    if (!probeMemo.has(key)) {
        probeMemo.set(key, probeCache({ thread, store: cacheStore, config: selectedRunConfig() }));
    }
    return probeMemo.get(key);
}

// The flattened form of a stored thread, or null when none is stored.
function storedThread(threadId) {
    if (!flattenedThreads.has(threadId)) {
        const snapshot = snapshotStore.get(threadId);
        if (snapshot === null) {
            return null;
        }
        flattenedThreads.set(threadId, flattenThread(snapshot.item));
    }
    return flattenedThreads.get(threadId);
}

function invalidateResultCache() {
    probeMemo.clear();
}

// Refreshes what the stores drive: the storage line, the thread buttons, the estimate.
function afterStoreChange() {
    refreshStorageInfo();
    refreshThreadButtons();
    return updateEstimate();
}

// The probe for the current thread, share, and models once it has finished, null until then. A run
// it reports as fully cached needs no key.
let latestProbe = null;

function runIsFullyCached() {
    return latestProbe !== null && latestProbe.complete;
}

function renderEstimate(comments, estimate, seconds, probe) {
    elements.estimate.textContent = `${shareText(comments)}, ${Math.round(estimate.tokens / 1000)}k tokens. Next run: ${formatNextRun({ usd: estimate.usd, seconds, probe })}`;
}

// Dragging the slider fires many input events; the text forecast follows each one, the probe waits for a pause.
const PROBE_DEBOUNCE_MS = 150;

// Refreshes the share text, the forecast, and the Run button. Returns a promise of the probe for the
// current selection, resolving to null when a later change superseded it or nothing is selected.
async function updateEstimate() {
    const isCurrent = probeLatest.start();
    latestProbe = null;
    if (loadedThread === null) {
        elements.shareRow.hidden = true;
        elements.estimate.textContent = '';
        refreshRunButton();
        return null;
    }
    const thread = selectedThread();
    const comments = thread.comments;
    const { volumeKey, consolidationKey } = selectedModelKeys();
    const estimate = estimateRunCost(comments, selectedCostRate());
    const seconds = estimateRunSeconds(estimate.tokens, volumeKey, consolidationKey);
    elements.shareRow.hidden = false;
    refreshRunButton();
    if (comments.length === 0) {
        elements.estimate.textContent = `${shareText(comments)}.`;
        return null;
    }
    renderEstimate(comments, estimate, seconds, null);
    try {
        await defaultSleep(PROBE_DEBOUNCE_MS);
        if (!isCurrent()) {
            return null;
        }
        const probe = await probeSelection(thread);
        if (!isCurrent()) {
            return null;
        }
        latestProbe = probe;
        renderEstimate(comments, estimate, seconds, probe);
        refreshRunButton();
        return probe;
    } catch (error) {
        setStatus(`Cache check failed: ${error.message}`, true);
        return null;
    }
}

function refreshRunButton() {
    elements.run.disabled = activeController !== null || loadedThread === null || selectedComments().length === 0
        || (!keyAvailable() && !runIsFullyCached());
}

function setRunning() {
    const isRunning = activeController !== null;
    elements.run.hidden = isRunning;
    elements.cancel.hidden = !isRunning;
    elements.loadThread.disabled = isRunning;
    elements.refreshThread.disabled = isRunning;
    refreshRunButton();
}

function refreshStorageInfo() {
    const cachedCalls = cacheStore.count();
    const storedThreads = snapshotStore.count();
    elements.storageInfo.textContent = `Cached in this browser: ${cachedCalls} model calls, ${storedThreads} threads.`;
    elements.deleteCached.hidden = cachedCalls === 0 && storedThreads === 0;
}

// Cheap enough to run on every keystroke in the thread box: existence checks only.
// Load appears while the box denotes a thread other than the loaded one; Refresh while the loaded thread is stored.
function refreshThreadButtons() {
    const threadId = threadIdInBox();
    elements.refreshThread.hidden = loadedThread === null || !snapshotStore.has(String(loadedThread.id));
    elements.loadThread.hidden = threadId === null || isLoadedThread(threadId);
}

// The held key is never written back into the input; while one is held the input is hidden.
function refreshKeyState() {
    const held = currentApiKey() !== null;
    elements.keyEntry.hidden = held;
    elements.keyStored.hidden = !held;
    elements.keyScope.textContent = keyScopeText();
}

function fillModelOptions(select, choices, defaultKey) {
    for (const [key, choice] of Object.entries(choices)) {
        const option = makeElement('option', { text: choice.label });
        option.value = key;
        select.appendChild(option);
    }
    select.value = defaultKey;
}

// The thread box holds a numeric id typed by hand, or search text that drives the list under it; picking a
// row from the list loads that story directly. After a load the box is emptied.
const SEARCH_MIN_CHARS = 3;
const SEARCH_DEBOUNCE_MS = 300;

// The Min comments box hides stories with fewer comments from both lists. An empty or non-numeric box hides
// nothing. The default keeps front-page stories large enough for a table with more than a few rows.
const DEFAULT_MIN_COMMENTS = 100;

function minCommentsInBox() {
    return positiveNumberInBox(elements.minComments) ?? 0;
}

function storiesAboveMinComments(stories) {
    const minimum = minCommentsInBox();
    return stories.filter(story => story.numComments >= minimum);
}

// The thread id the box currently denotes: a typed id, or the id behind a picked or loaded title.
function threadIdInBox() {
    const text = elements.threadId.value.trim();
    return isThreadId(text) ? text : null;
}

// The list under the box is drawn by the page (a combobox with a listbox): a header row says what the
// list holds and story rows follow. The browser's own datalist could not show a header, filtered the rows
// by the box text itself, and could not be opened or closed from the page.
const HEADER_HOME_PAGE = 'Home page';
const HEADER_SEARCHING = 'Searching sorted by date';
const HEADER_MATCHES = 'Matches sorted by date';
const HEADER_NO_MATCHES = 'No matches';
const HEADER_LOADING_HOME_PAGE = 'Loading the home page';
const HEADER_HOME_PAGE_UNAVAILABLE = 'Home page unavailable';
const HEADER_SEARCH_FAILED = 'Search failed';
const searchHeader = rows => (rows.length === 0 ? HEADER_NO_MATCHES : HEADER_MATCHES);

let homePageStories = null;
let homePageHeader = HEADER_LOADING_HOME_PAGE;
let lastSearch = null;
let listStories = [];
let activeIndex = -1;

// Bolds the rows whose run would be served entirely from the cache at the current share and models,
// so picking them gives the result at once. It runs after the list is painted, yielding before each
// probe so typing stays responsive, and only for stored threads; a list drawn later ends it.
async function markFullyCachedRows(rows) {
    const isCurrent = listLatest.start();
    for (const { story, item } of rows) {
        const thread = storedThread(String(story.id));
        if (thread === null) {
            continue;
        }
        const selection = threadShare(thread, sharePercent());
        if (selection.comments.length === 0) {
            continue;
        }
        await defaultSleep(0);
        if (!isCurrent()) {
            return;
        }
        const probe = await probeSelection(selection);
        if (!isCurrent()) {
            return;
        }
        if (probe.complete) {
            item.classList.add('cached');
            item.title = 'Fully cached: the run is instant';
        }
    }
}

function listIsOpen() {
    return !elements.storyList.hidden;
}

// Fills and opens the list: the header row, then one row per story above the Min comments box, newest
// first. headerFor names the header from the rows that remain.
function showList(stories, headerFor) {
    listStories = sortStoriesNewestFirst(storiesAboveMinComments(stories));
    activeIndex = -1;
    const header = headerFor(listStories);
    const headerItem = makeElement('li', { className: 'header', text: header });
    const rows = listStories.map((story, index) => {
        const item = makeElement('li', { text: storyLabel(story) });
        item.setAttribute('role', 'option');
        item.id = `story-option-${index}`;
        item.addEventListener('mousedown', () => pickStory(story));
        return { story, item };
    });
    elements.storyList.replaceChildren(headerItem, ...rows.map(row => row.item));
    elements.storyList.hidden = false;
    elements.threadId.setAttribute('aria-expanded', 'true');
    elements.threadId.removeAttribute('aria-activedescendant');
    markFullyCachedRows(rows).catch(error => setStatus(`Cache check failed: ${error.message}`, true));
}

function closeList() {
    elements.storyList.hidden = true;
    elements.threadId.setAttribute('aria-expanded', 'false');
    elements.threadId.removeAttribute('aria-activedescendant');
    activeIndex = -1;
}

// Moves the keyboard highlight, wrapping at both ends.
function setActiveItem(index) {
    const items = elements.storyList.querySelectorAll('li[role="option"]');
    if (items.length === 0) {
        return;
    }
    activeIndex = (index + items.length) % items.length;
    items.forEach((item, itemIndex) => item.classList.toggle('active', itemIndex === activeIndex));
    const active = items[activeIndex];
    elements.threadId.setAttribute('aria-activedescendant', active.id);
    active.scrollIntoView({ block: 'nearest' });
}

function pickStory(story) {
    closeList();
    loadThreadFromPage(String(story.id));
}

// Shows what fits the box text: the home page while the text is short (filtered by it), the search
// results once it is long enough; a numeric id needs no list.
function refreshList() {
    const text = elements.threadId.value.trim();
    if (isThreadId(text)) {
        closeList();
        return;
    }
    if (text.length >= SEARCH_MIN_CHARS) {
        if (lastSearch !== null && lastSearch.text === text) {
            showList(lastSearch.stories, searchHeader);
        } else {
            scheduleStorySearch(text);
        }
        return;
    }
    searchLatest.cancel();
    if (homePageStories === null) {
        showList([], () => homePageHeader);
        return;
    }
    const needle = text.toLowerCase();
    showList(homePageStories.filter(story => story.title.toLowerCase().includes(needle)), () => HEADER_HOME_PAGE);
}

async function populateFrontPage() {
    try {
        homePageStories = await fetchStories(CONSTANTS.HN_FRONT_PAGE_URL, 'the home page');
    } catch (error) {
        homePageHeader = HEADER_HOME_PAGE_UNAVAILABLE;
        setStatus(`Home page suggestions unavailable: ${error.message}. A thread id can still be typed.`, true);
    }
    if (listIsOpen()) {
        refreshList();
    }
}

// Keeps the current rows under a "searching" header until the results arrive. Typing fires many input
// events; the search waits for a pause. A result for a search that is no longer the latest, or that
// arrives after the list was closed, is dropped.
async function scheduleStorySearch(text) {
    showList(listStories, () => HEADER_SEARCHING);
    const isCurrent = searchLatest.start();
    await defaultSleep(SEARCH_DEBOUNCE_MS);
    if (!isCurrent()) {
        return;
    }
    try {
        const stories = await fetchStories(storySearchUrl(text), `the search "${text}"`);
        lastSearch = { text, stories };
        if (isCurrent() && listIsOpen()) {
            showList(stories, searchHeader);
        }
    } catch (error) {
        if (isCurrent() && listIsOpen()) {
            showList([], () => HEADER_SEARCH_FAILED);
        }
        setStatus(`Story search failed: ${error.message}`, true);
    }
}

// Loads the thread named in the box. The box is emptied after a load so the suggestion list shows in full
// on the next click; the loaded thread is named on the info line instead.
function loadThreadFromBox() {
    const threadId = threadIdInBox();
    if (threadId === null) {
        setStatus('Enter a numeric Hacker News thread id, or pick a story from the list.', true);
        return;
    }
    loadThreadFromPage(threadId);
}

// Loads the thread from the stored copy or from the API, then shows its size and the estimate.
// The results describe one thread; loading any thread, including a refresh of the same one, removes them.
function clearResults() {
    elements.results.replaceChildren();
    elements.warnings.hidden = true;
}

async function loadThreadFromPage(threadId) {
    loadedThread = null;
    clearResults();
    updateEstimate();
    try {
        let snapshot = snapshotStore.get(threadId);
        let stored = true;
        if (snapshot === null) {
            setStatus(`Fetching thread ${threadId}`);
            snapshot = { fetchedAt: new Date().toISOString(), item: await fetchThreadItem(threadId) };
            stored = snapshotStore.set(threadId, snapshot);
            setStatus(stored ? '' : 'Thread could not be stored (browser storage full or too large); a reload will fetch it again.', !stored);
        } else {
            setStatus('');
        }
        loadedThread = flattenedThreads.get(threadId) ?? flattenThread(snapshot.item);
        if (stored) {
            flattenedThreads.set(threadId, loadedThread);
        }
        applyMaxCostToShare();
        elements.threadId.value = '';
        closeList();
        elements.threadTitle.textContent = loadedThread.title;
        elements.threadInfo.textContent = `${loadedThread.comments.length} comments, posted ${storyDate(loadedThread)}, id ${loadedThread.id}, fetched ${new Date(snapshot.fetchedAt).toLocaleString()}${stored ? '' : ', not stored'}`;
    } catch (error) {
        elements.threadTitle.textContent = '';
        elements.threadInfo.textContent = '';
        setStatus(`Error: ${error.message}`, true);
    }
    // A load that turns out fully cached runs by itself: the result is free and instant.
    const probe = await afterStoreChange();
    if (probe !== null && probe.complete && activeController === null) {
        runFromPage();
    }
}

function renderStatement(sideClass, text) {
    return makeElement('p', { className: `statement ${sideClass}`, text });
}

// Three segments sized by share of all commenters on the axis; the bar itself has a fixed width.
function renderProportionBar(row) {
    const bar = makeElement('div', { className: 'proportion' });
    const shares = proportionShares(row);
    ['side1', 'mid', 'side2'].forEach((segmentClass, index) => {
        const segment = makeElement('span', { className: segmentClass });
        segment.style.setProperty('--share', shares[index]);
        bar.appendChild(segment);
    });
    return bar;
}

// The vote counts sit flanking the bar, one on each side, rather than inline with the statements.
function renderProportionRow(row) {
    const wrapper = makeElement('div', { className: 'proportion-row' });
    wrapper.appendChild(makeElement('span', { className: 'count side1', text: String(row.countA) }));
    wrapper.appendChild(renderProportionBar(row));
    wrapper.appendChild(makeElement('span', { className: 'count side2', text: String(row.countB) }));
    return wrapper;
}

function axisMetaText(row) {
    const middlePart = row.countM === 0 ? '' : `, ${row.countM} middle`;
    return `${row.comments} comments, ${row.authors} commenters${middlePart}`;
}

function renderAxis(row) {
    const block = makeElement('div', { className: 'axis' });
    block.appendChild(renderStatement('side1', row.statementA));
    block.appendChild(renderProportionRow(row));
    block.appendChild(renderStatement('side2', row.statementB));
    const meta = makeElement('div', { className: 'meta', text: axisMetaText(row) });
    block.appendChild(meta);
    return block;
}

function renderResults(result) {
    const warningList = elements.warnings.querySelector('ul');
    warningList.replaceChildren(...result.warnings.map(text => makeElement('li', { text })));
    elements.warnings.querySelector('summary').textContent = `${result.warnings.length} warnings`;
    elements.warnings.hidden = result.warnings.length === 0;
    elements.results.replaceChildren(...result.rows.map(renderAxis));
}

// PKCE sign-in needs an http(s) page with a stable URL as the callback and a secure context for
// SHA-256; a page opened from a file cannot use it, so the button is shown only when it can work.
function pkceAvailable() {
    return window.isSecureContext && /^https?:$/.test(location.protocol) && Boolean(globalThis.crypto && globalThis.crypto.subtle);
}

function pageCallbackUrl() {
    return location.origin + location.pathname;
}

// The remember choice rides along in sessionStorage with the verifier, since the page is left and re-entered.
async function startOpenRouterSignIn() {
    const verifier = makePkceVerifier();
    sessionStorage.setItem(CONSTANTS.PKCE_VERIFIER_STORAGE_KEY, verifier);
    sessionStorage.setItem(CONSTANTS.PKCE_REMEMBER_STORAGE_KEY, String(elements.rememberKey.checked));
    location.assign(openRouterAuthUrl(pageCallbackUrl(), await pkceChallenge(verifier)));
}

// On return from OpenRouter the URL carries ?code=; exchange it for a key, hold the key, and remove
// the code from the URL so a reload does not repeat the exchange.
async function finishOpenRouterSignIn() {
    const params = new URLSearchParams(location.search);
    const code = params.get('code');
    if (code === null) {
        return;
    }
    const verifier = sessionStorage.getItem(CONSTANTS.PKCE_VERIFIER_STORAGE_KEY);
    const remember = sessionStorage.getItem(CONSTANTS.PKCE_REMEMBER_STORAGE_KEY) === 'true';
    sessionStorage.removeItem(CONSTANTS.PKCE_VERIFIER_STORAGE_KEY);
    sessionStorage.removeItem(CONSTANTS.PKCE_REMEMBER_STORAGE_KEY);
    history.replaceState(null, '', pageCallbackUrl());
    if (verifier === null) {
        setStatus('OpenRouter sign-in returned a code, but this browser has no matching sign-in in progress. Start the sign-in again from this page.', true);
        return;
    }
    try {
        holdApiKey(await exchangeOpenRouterCode({ code, verifier }), remember);
        updateEstimate();
        setStatus(`Signed in with OpenRouter; the key is ${keyScopeText()}.`);
    } catch (error) {
        setStatus(`OpenRouter sign-in failed: ${error.message}`, true);
    }
}

// Uses the held key, or takes the typed one on first use. Returns null when there is neither.
function resolveApiKey() {
    const held = currentApiKey();
    if (held !== null) {
        return held;
    }
    const typed = elements.apiKey.value.trim();
    if (typed === '') {
        setStatus('Enter an OpenRouter key.', true);
        return null;
    }
    holdApiKey(typed, elements.rememberKey.checked);
    elements.apiKey.value = '';
    return typed;
}

// While a run is in progress the status line shows the latest progress report with the elapsed time,
// ticking once a second; afterwards it shows the outcome with the time taken.
const ELAPSED_TICK_MS = 1000;

function startElapsedCounter() {
    const startedAt = Date.now();
    let progressText = 'Starting';
    const elapsed = () => formatElapsed((Date.now() - startedAt) / 1000);
    const tick = () => setStatus(`${progressText}, ${elapsed()} elapsed`);
    tick();
    const timer = setInterval(tick, ELAPSED_TICK_MS);
    return {
        setProgress(text) {
            progressText = text;
            tick();
        },
        elapsed,
        stop() {
            clearInterval(timer);
        },
    };
}

// A run the latest probe reports as fully cached needs no key; any other run resolves one first.
async function runFromPage() {
    if (loadedThread === null) {
        setStatus('Load a thread first.', true);
        return;
    }
    const thread = selectedThread();
    if (thread.comments.length === 0) {
        setStatus('Nothing selected: move the slider above 0%.', true);
        return;
    }
    const fullyCached = runIsFullyCached();
    const apiKey = fullyCached ? currentApiKey() : resolveApiKey();
    if (apiKey === null && !fullyCached) {
        return;
    }
    let calledModel = true;
    activeController = new AbortController();
    const signal = activeController.signal;
    setRunning();
    clearResults();
    const counter = startElapsedCounter();
    try {
        const result = await runPipeline({
            thread,
            signal,
            config: selectedRunConfig(),
            onProgress: update => counter.setProgress(formatProgress(update)),
            callChat: makeCachedCallChat(makeOpenRouterCallChat({ apiKey }), cacheStore),
        });
        counter.stop();
        calledModel = result.calls !== result.stats.cachedCalls;
        renderResults(result);
        setStatus(`Done in ${counter.elapsed()}, ${formatRunCost(result)}. ${formatRunSummary(result).join(' ')}`);
    } catch (error) {
        counter.stop();
        setStatus(signal.aborted ? `Cancelled after ${counter.elapsed()}.` : `Error after ${counter.elapsed()}: ${error.message}`, !signal.aborted);
        console.error(error);
    } finally {
        activeController = null;
        setRunning();
        if (calledModel) {
            invalidateResultCache();
        }
        afterStoreChange();
    }
}

elements.run.addEventListener('click', runFromPage);
elements.cancel.addEventListener('click', () => {
    if (activeController) {
        activeController.abort();
    }
});
elements.wipeKey.addEventListener('click', () => {
    forgetApiKey();
    refreshRunButton();
    setStatus('OpenRouter key wiped from this browser.');
});
elements.deleteCached.addEventListener('click', () => {
    const removedCalls = cacheStore.count();
    const removedSnapshots = snapshotStore.count();
    cacheStore.clear();
    snapshotStore.clear();
    flattenedThreads.clear();
    invalidateResultCache();
    afterStoreChange();
    setStatus(`Deleted from this browser: ${removedCalls} cached model calls and ${removedSnapshots} threads. The OpenRouter key is kept.`);
});
elements.loadThread.addEventListener('click', loadThreadFromBox);
// The list opens on focus, click, or typing; arrows move the highlight, Enter picks it (or loads a typed
// id), Escape closes; leaving the box closes it too. A press inside the list keeps the focus in the box.
// Editing the box moves focus off the thread box, which closes the list; the filter applies when the list is next drawn.
elements.minComments.value = DEFAULT_MIN_COMMENTS;
elements.threadId.addEventListener('focus', refreshList);
elements.threadId.addEventListener('click', () => {
    if (!listIsOpen()) {
        refreshList();
    }
});
elements.threadId.addEventListener('input', () => {
    refreshThreadButtons();
    refreshList();
});
elements.threadId.addEventListener('keydown', event => {
    if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
        event.preventDefault();
        if (!listIsOpen()) {
            refreshList();
        }
        setActiveItem(activeIndex + (event.key === 'ArrowDown' ? 1 : -1));
    } else if (event.key === 'Enter') {
        event.preventDefault();
        if (listIsOpen() && activeIndex >= 0) {
            pickStory(listStories[activeIndex]);
        } else {
            loadThreadFromBox();
        }
    } else if (event.key === 'Escape') {
        closeList();
    }
});
elements.threadId.addEventListener('blur', closeList);
elements.storyList.addEventListener('mousedown', event => event.preventDefault());
// A typed id followed by leaving the box loads the thread unless it is already loaded.
elements.threadId.addEventListener('change', () => {
    const threadId = threadIdInBox();
    if (threadId !== null && !isLoadedThread(threadId)) {
        loadThreadFromPage(threadId);
    }
});
elements.refreshThread.addEventListener('click', () => {
    const threadId = String(loadedThread.id);
    snapshotStore.remove(threadId);
    flattenedThreads.delete(threadId);
    invalidateResultCache();
    loadThreadFromPage(threadId);
});
elements.maxCost.value = DEFAULT_MAX_COST_USD;
function refitShareAndEstimate() {
    elements.maxCost.value = maxCostInBox();
    applyMaxCostToShare();
    updateEstimate();
}
elements.share.addEventListener('input', updateEstimate);
elements.maxCost.addEventListener('change', refitShareAndEstimate);
elements.volumeModel.addEventListener('change', refitShareAndEstimate);
elements.consolidationModel.addEventListener('change', refitShareAndEstimate);
elements.apiKey.addEventListener('input', refreshRunButton);
elements.connectOpenRouter.hidden = !pkceAvailable();
elements.connectOpenRouter.addEventListener('click', () => {
    startOpenRouterSignIn().catch(error => setStatus(`OpenRouter sign-in could not start: ${error.message}`, true));
});
finishOpenRouterSignIn();

fillModelOptions(elements.volumeModel, VOLUME_MODELS, DEFAULT_VOLUME_KEY);
fillModelOptions(elements.consolidationModel, CONSOLIDATION_MODELS, DEFAULT_CONSOLIDATION_KEY);
refreshKeyState();
updateEstimate();
refreshThreadButtons();
refreshStorageInfo();
populateFrontPage();
</script>
</body>
</html>
