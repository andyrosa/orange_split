<script id="core">
// Core pipeline: no DOM access. Shared by the page script and by Node (tests, scripts/run_node.js).

const CONSTANTS = Object.freeze({
    HN_ITEM_URL: 'https://hn.algolia.com/api/v1/items/',
    HN_FRONT_PAGE_URL: 'https://hn.algolia.com/api/v1/search?tags=front_page&hitsPerPage=30',
    HN_STORY_SEARCH_URL: 'https://hn.algolia.com/api/v1/search?tags=story&hitsPerPage=20&query=',
    OPENROUTER_URL: 'https://openrouter.ai/api/v1/chat/completions',
    OPENROUTER_AUTH_URL: 'https://openrouter.ai/auth',
    OPENROUTER_KEY_EXCHANGE_URL: 'https://openrouter.ai/api/v1/auth/keys',
    PKCE_VERIFIER_STORAGE_KEY: 'openrouter_pkce_verifier',
    PKCE_REMEMBER_STORAGE_KEY: 'openrouter_pkce_remember',
    STORAGE_KEY_OPENROUTER: 'openrouter_api_key',
    CACHE_KEY_PREFIX: 'hn_polarization_cache:',
    THREAD_KEY_PREFIX: 'hn_polarization_thread:',
    CHARS_PER_TOKEN: 4,
    COMMENT_FRAME_TOKENS: 12,
    TEMPERATURE: 0,
    MAX_ATTEMPTS: 4,
    RETRY_BASE_MS: 2000,
    BAR_CELLS: 20,
});

// Models are chosen per role: one for the high-volume stages (extraction and scoring) and one for
// consolidation. Sampling and reasoning are per stage because providers differ: Haiku 4.5 accepts
// temperature but not seed; Sonnet 5 and Opus 5 accept neither and think adaptively; GLM 5.3 Flash
// cannot run without reasoning and needs large output ceilings; Gemini accepts temperature and seed;
// the GPT-5.6 models (Luna, Sol) accept seed and a reasoning effort but not temperature; Claude Fable 5.1
// accepts a reasoning effort but neither temperature nor seed.
// null omits the field from the request.
//
// The cost and time rates come from measured runs on a 1300-comment thread (about 104k comment
// tokens), a 484-comment thread (about 33k), and a 38-comment thread; both cost and wall time scaled with comment tokens in those runs,
// consolidation included, since its thinking grows with the number of candidates. minimumSeconds is the
// latency of one call of the model in its role, the floor for a stage no matter how small the thread.
const SAMPLING_SEED = 12345;
const DEFAULT_VOLUME_KEY = 'lunaLow';
const DEFAULT_CONSOLIDATION_KEY = 'sonnet5';

// The sampling profiles the providers accept.
const SAMPLING_TEMPERATURE = Object.freeze({ temperature: CONSTANTS.TEMPERATURE });
const SAMPLING_TEMPERATURE_AND_SEED = Object.freeze({ temperature: CONSTANTS.TEMPERATURE, seed: SAMPLING_SEED });
const SAMPLING_SEED_ONLY = Object.freeze({ seed: SAMPLING_SEED });

// The output ceiling of the consolidation call for every consolidator whose provider allows it.
const CONSOLIDATION_MAX_TOKENS = 128000;

// The three stages in run order, each served by one role's model. Config fields carry the suffix
// (modelExtract, samplingExtract, ...); the estimate line uses the call name.
const STAGES = Object.freeze([
    Object.freeze({ key: 'extract', suffix: 'Extract', callName: 'extraction', role: 'volume' }),
    Object.freeze({ key: 'consolidate', suffix: 'Consolidate', callName: 'consolidation', role: 'consolidation' }),
    Object.freeze({ key: 'score', suffix: 'Score', callName: 'scoring', role: 'volume' }),
]);
const STAGE_ORDER = Object.freeze(STAGES.map(stage => stage.key));
const STAGE_BY_KEY = Object.freeze(Object.fromEntries(STAGES.map(stage => [stage.key, stage])));

// An option entry of one role: the model, sampling, and reasoning shared by every stage the role serves,
// and the output ceiling per stage key, expanded into the config fields of those stages. The label is
// built from the entry when read.
function optionEntry(role, labelFor, { model, sampling, reasoning, maxTokens, ...rest }) {
    const config = {};
    for (const stage of STAGES.filter(stage => stage.role === role)) {
        if (typeof maxTokens[stage.key] !== 'number') {
            throw new Error(`${rest.name}: no output ceiling for the ${stage.key} stage`);
        }
        config[`model${stage.suffix}`] = model;
        config[`sampling${stage.suffix}`] = sampling;
        config[`reasoning${stage.suffix}`] = reasoning;
        config[`maxTokens${stage.suffix}`] = maxTokens[stage.key];
    }
    return Object.freeze({ ...rest, config, get label() { return labelFor(this); } });
}
const volumeEntry = entry => optionEntry('volume', volumeLabel, entry);
const consolidationEntry = entry => optionEntry('consolidation', consolidationLabel, entry);

const VOLUME_MODELS = Object.freeze({
    haiku: volumeEntry({
        name: 'Claude Haiku 4.5',
        quality: { stancesPerComment: [0.5], twoSidedPer100Comments: [3, 4], reviewHeldPercent: 59, reviewWrongPercent: 12, note: 'clean output' },
        model: 'anthropic/claude-haiku-4.5', sampling: SAMPLING_TEMPERATURE, reasoning: null,
        maxTokens: { extract: 16000, score: 8000 },
        costPerThousandTokensUsd: 0.0119,
        secondsPerThousandTokens: 0.87,
        minimumSeconds: 8,
        candidateFactor: 1, // the reference: 64 candidates on thread 49537553
    }),
    glmFlash: volumeEntry({
        name: 'GLM 5.3 Flash',
        quality: { stancesPerComment: [0.5, 0.6], twoSidedPer100Comments: [3.5, 4], note: 'the most coverage; some nonstandard output shapes, which the page accepts' },
        model: 'z-ai/glm-5.3-flash', sampling: SAMPLING_TEMPERATURE_AND_SEED, reasoning: { effort: 'low' },
        maxTokens: { extract: 64000, score: 32000 },
        costPerThousandTokensUsd: 0.0024,
        secondsPerThousandTokens: 31,
        minimumSeconds: 100,
        candidateFactor: 1.3, // 247 candidates against Haiku 4.5's 195 on the test thread
    }),
    geminiFlash: volumeEntry({
        name: 'Gemini 3.8 Flash',
        quality: { stancesPerComment: [0.3], twoSidedPer100Comments: [3], note: 'the least coverage; the most stable ranking between runs' },
        model: 'google/gemini-3.8-flash', sampling: SAMPLING_TEMPERATURE_AND_SEED, reasoning: null,
        maxTokens: { extract: 16000, score: 16000 },
        costPerThousandTokensUsd: 0.0244,
        secondsPerThousandTokens: 2.1,
        minimumSeconds: 8,
        candidateFactor: 1, // not measured; assumed equal to Haiku 4.5
    }),
    opus5: volumeEntry({
        name: 'Claude Opus 5',
        quality: { stancesPerComment: [0.7], twoSidedPer100Comments: [13], reviewHeldPercent: 74, reviewWrongPercent: 0 },
        model: 'anthropic/claude-opus-5', sampling: null, reasoning: null,
        maxTokens: { extract: 16000, score: 8000 },
        costPerThousandTokensUsd: 0.1317,
        secondsPerThousandTokens: 3.18,
        minimumSeconds: 50,
        candidateFactor: 2.1, // 134 candidates against 64
    }),
    lunaLow: volumeEntry({
        name: 'GPT-5.6 Luna, reasoning low',
        quality: { stancesPerComment: [0.5], twoSidedPer100Comments: [6], reviewHeldPercent: 80, reviewWrongPercent: 6 },
        model: 'openai/gpt-5.6-luna', sampling: SAMPLING_SEED_ONLY, reasoning: { effort: 'low' },
        maxTokens: { extract: 32000, score: 16000 },
        costPerThousandTokensUsd: 0.0033,
        secondsPerThousandTokens: 1.16,
        minimumSeconds: 20,
        candidateFactor: 1, // 62 candidates against 64
    }),
});

const CONSOLIDATION_MODELS = Object.freeze({
    sonnet5: consolidationEntry({
        name: 'Claude Sonnet 5',
        quality: { twoSidedPercent: [61, 74], runs: 'three runs' },
        model: 'anthropic/claude-sonnet-5', sampling: null, reasoning: null, maxTokens: { consolidate: CONSOLIDATION_MAX_TOKENS },
        costPerThousandTokensUsd: 0.0029,
        secondsPerThousandTokens: 2.4,
        minimumSeconds: 15,
    }),
    glm53: consolidationEntry({
        name: 'GLM 5.3',
        quality: { twoSidedPercent: [79, 88], runs: 'two runs' },
        model: 'z-ai/glm-5.3', sampling: SAMPLING_TEMPERATURE_AND_SEED, reasoning: { effort: 'high' }, maxTokens: { consolidate: CONSOLIDATION_MAX_TOKENS },
        costPerThousandTokensUsd: 0.0018,
        secondsPerThousandTokens: 4.6,
        minimumSeconds: 120,
    }),
    geminiFlash: consolidationEntry({
        name: 'Gemini 3.8 Flash',
        quality: { twoSidedPercent: [93], note: 'measured with the same model scoring' },
        model: 'google/gemini-3.8-flash', sampling: SAMPLING_TEMPERATURE_AND_SEED, reasoning: null, maxTokens: { consolidate: 65536 },
        costPerThousandTokensUsd: 0.0003,
        secondsPerThousandTokens: 0.2,
        minimumSeconds: 8,
    }),
    opus5: consolidationEntry({
        name: 'Claude Opus 5',
        quality: { twoSidedPercent: [58], note: 'fine-grained axes' },
        model: 'anthropic/claude-opus-5', sampling: null, reasoning: null, maxTokens: { consolidate: CONSOLIDATION_MAX_TOKENS },
        costPerThousandTokensUsd: 0.0033,
        secondsPerThousandTokens: 0.6,
        minimumSeconds: 10,
    }),
    solLow: consolidationEntry({
        name: 'GPT-5.6 Sol, reasoning low',
        quality: { twoSidedPercent: [38], note: '55% one-arm' },
        model: 'openai/gpt-5.6-sol', sampling: SAMPLING_SEED_ONLY, reasoning: { effort: 'low' }, maxTokens: { consolidate: CONSOLIDATION_MAX_TOKENS },
        costPerThousandTokensUsd: 0.0010,
        secondsPerThousandTokens: 1.16,
        minimumSeconds: 8,
    }),
    lunaMax: consolidationEntry({
        name: 'GPT-5.6 Luna, reasoning max',
        quality: { twoSidedPercent: [56] },
        model: 'openai/gpt-5.6-luna', sampling: SAMPLING_SEED_ONLY, reasoning: { effort: 'max' }, maxTokens: { consolidate: CONSOLIDATION_MAX_TOKENS },
        costPerThousandTokensUsd: 0.0025,
        secondsPerThousandTokens: 21.6,
        minimumSeconds: 190,
    }),
    fableLow: consolidationEntry({
        name: 'Claude Fable 5.1, reasoning low',
        quality: { twoSidedPercent: [59] },
        model: 'anthropic/claude-fable-5.1', sampling: null, reasoning: { effort: 'low' }, maxTokens: { consolidate: CONSOLIDATION_MAX_TOKENS },
        costPerThousandTokensUsd: 0.0096,
        secondsPerThousandTokens: 1.71,
        minimumSeconds: 15,
    }),
});

const ROLE_CHOICES = Object.freeze({ volume: VOLUME_MODELS, consolidation: CONSOLIDATION_MODELS });

// One role's option entry by key.
function roleChoice(role, key) {
    const choice = ROLE_CHOICES[role][key];
    if (!choice) {
        throw new Error(`unknown ${role} model choice: ${key}`);
    }
    return choice;
}

function buildStageConfig(volumeKey, consolidationKey) {
    return { ...roleChoice('volume', volumeKey).config, ...roleChoice('consolidation', consolidationKey).config };
}

// Option labels are built from each entry's constants and measured quality record, so a label can never
// disagree with the forecast that uses the same constants. Comment tokens per comment come from the test
// thread: 102,975 tokens over 1297 comments.
const TOKENS_PER_COMMENT = 79.4;
const COMMENTS_PER_LABEL = 1000;
const COMMENTS_PER_ROW_RATE = 100;

// "3" or "3 to 4", with a suffix on each number when given ("61% to 74%").
function rangeText(values, suffix) {
    return values.map(value => `${value}${suffix}`).join(' to ');
}

function perThousandCommentsText(choice) {
    const usd = ((choice.costPerThousandTokensUsd * TOKENS_PER_COMMENT * COMMENTS_PER_LABEL) / 1000).toFixed(2);
    const seconds = (choice.secondsPerThousandTokens * TOKENS_PER_COMMENT * COMMENTS_PER_LABEL) / 1000;
    return `$${usd} and ${formatDuration(seconds)} per ${COMMENTS_PER_LABEL} comments`;
}

// The name, the rates, then the quality parts and the note when the entry has one.
function optionLabel(choice, qualityParts) {
    const parts = choice.quality.note ? [...qualityParts, choice.quality.note] : qualityParts;
    return `${choice.name}: ${perThousandCommentsText(choice)}. ${parts.join('; ')}.`;
}

// Extraction and scoring: stances per comment, two-sided rows per 100 comments, the blind-review shares
// when measured, then a note.
function volumeLabel(choice) {
    const quality = choice.quality;
    const parts = [
        `${rangeText(quality.stancesPerComment, '')} stances per comment`,
        `${rangeText(quality.twoSidedPer100Comments, '')} two-sided rows per ${COMMENTS_PER_ROW_RATE} comments`,
    ];
    if (quality.reviewHeldPercent !== undefined) {
        parts.push(`${quality.reviewHeldPercent}% of stances held under blind review, ${quality.reviewWrongPercent}% wrong`);
    }
    return optionLabel(choice, parts);
}

// Consolidation: the share of axes two-sided, the run count when a range, then a note.
function consolidationLabel(choice) {
    const quality = choice.quality;
    const runsPart = quality.runs ? ` across ${quality.runs}` : '';
    return optionLabel(choice, [`${rangeText(quality.twoSidedPercent, '%')} of axes two-sided${runsPart}`]);
}

// One per-thousand-token rate field over the two chosen models. The consolidation call's cost and time
// grow with the number of candidates, which the volume model sets, so its rate is scaled by that model's
// candidateFactor, its candidate count relative to Haiku 4.5's on the same thread.
function combinedRate(volumeKey, consolidationKey, field) {
    const volume = roleChoice('volume', volumeKey);
    return volume[field] + roleChoice('consolidation', consolidationKey)[field] * volume.candidateFactor;
}

// Wall time scales with tokens, but the three stages run in sequence and each is at least one call
// long (extraction and scoring one volume call each, consolidation one consolidation call), so a small
// thread is bounded by latency: the smoke tests took 28 seconds for 38 comments with the Claude pair.
function estimateRunSeconds(tokens, volumeKey, consolidationKey) {
    const choices = { volume: roleChoice('volume', volumeKey), consolidation: roleChoice('consolidation', consolidationKey) };
    const scaled = (combinedRate(volumeKey, consolidationKey, 'secondsPerThousandTokens') * tokens) / 1000;
    const floor = STAGES.reduce((sum, stage) => sum + choices[stage.role].minimumSeconds, 0);
    return Math.max(scaled, floor);
}

// Applies per-stage fields (model, sampling, reasoning, maxTokens) to every stage.
function applyToAllStages(config, fields) {
    for (const stage of STAGES) {
        for (const [field, value] of Object.entries(fields)) {
            config[`${field}${stage.suffix}`] = value;
        }
    }
    return config;
}

// The model, sampling, reasoning, and output ceiling configured for one stage, as request fields.
function stageSettings(config, stageKey) {
    const { suffix } = STAGE_BY_KEY[stageKey];
    return {
        model: config[`model${suffix}`],
        sampling: config[`sampling${suffix}`],
        reasoning: config[`reasoning${suffix}`],
        maxTokens: config[`maxTokens${suffix}`],
    };
}

const DEFAULT_CONFIG = Object.freeze({
    ...buildStageConfig(DEFAULT_VOLUME_KEY, DEFAULT_CONSOLIDATION_KEY),
    extractBatchTokens: 3000,
    scoreBatchComments: 20,
    parentSnippetChars: 300,
    concurrency: 30,
    shuffleSeed: 777,
    budgetUsd: 1.0,
});

const STANCE_A = 'A';
const STANCE_B = 'B';
const STANCE_M = 'M';
const VALID_STANCES = new Set([STANCE_A, STANCE_B, STANCE_M]);

// ---------------------------------------------------------------------------
// Thread parsing
// ---------------------------------------------------------------------------

const ENTITY_TABLE = { amp: '&', lt: '<', gt: '>', quot: '"', apos: "'", nbsp: ' ' };

function decodeEntities(text) {
    return text.replace(/&(#x[0-9a-fA-F]+|#[0-9]+|[a-zA-Z]+);/g, (whole, body) => {
        if (body[0] === '#') {
            const isHex = body[1] === 'x' || body[1] === 'X';
            const codePoint = isHex ? parseInt(body.slice(2), 16) : parseInt(body.slice(1), 10);
            return Number.isFinite(codePoint) ? String.fromCodePoint(codePoint) : whole;
        }
        return Object.prototype.hasOwnProperty.call(ENTITY_TABLE, body) ? ENTITY_TABLE[body] : whole;
    });
}

function stripHtml(html) {
    const withBreaks = html.replace(/<p\b[^>]*>/gi, '\n\n').replace(/<br\s*\/?>/gi, '\n');
    const withoutTags = withBreaks.replace(/<[^>]+>/g, '');
    return decodeEntities(withoutTags).replace(/[ \t]+\n/g, '\n').trim();
}

function flattenThread(item) {
    const comments = [];
    function walk(node, depth) {
        for (const child of node.children || []) {
            if (child.type !== 'comment') {
                continue;
            }
            if (typeof child.text === 'string' && child.text.length > 0) {
                comments.push({
                    id: child.id,
                    author: child.author,
                    parentId: child.parent_id === undefined || child.parent_id === null ? node.id : child.parent_id,
                    depth,
                    text: stripHtml(child.text),
                });
            }
            walk(child, depth + 1);
        }
    }
    walk(item, 0);
    return { id: item.id, title: item.title || '', url: item.url || '', createdAt: item.created_at || null, comments };
}

// ---------------------------------------------------------------------------
// Batching
// ---------------------------------------------------------------------------

function indexCommentsById(comments) {
    return new Map(comments.map(comment => [comment.id, comment]));
}

function estimateTokens(text) {
    return Math.ceil(text.length / CONSTANTS.CHARS_PER_TOKEN);
}

function commentTokens(comment) {
    return estimateTokens(comment.text) + CONSTANTS.COMMENT_FRAME_TOKENS;
}

function totalCommentTokens(comments) {
    return comments.reduce((sum, comment) => sum + commentTokens(comment), 0);
}

function splitSubtrees(comments) {
    const subtrees = [];
    for (const comment of comments) {
        if (comment.depth === 0 || subtrees.length === 0) {
            subtrees.push([]);
        }
        subtrees[subtrees.length - 1].push(comment);
    }
    return subtrees;
}

function makeExtractBatches(comments, maxTokens) {
    const batches = [];
    let current = [];
    let currentTokens = 0;
    function close() {
        if (current.length > 0) {
            batches.push(current);
            current = [];
            currentTokens = 0;
        }
    }
    for (const subtree of splitSubtrees(comments)) {
        const subtreeTokens = totalCommentTokens(subtree);
        if (currentTokens + subtreeTokens <= maxTokens) {
            current.push(...subtree);
            currentTokens += subtreeTokens;
            continue;
        }
        close();
        if (subtreeTokens <= maxTokens) {
            current = subtree.slice();
            currentTokens = subtreeTokens;
            continue;
        }
        for (const comment of subtree) {
            const tokens = commentTokens(comment);
            if (current.length > 0 && currentTokens + tokens > maxTokens) {
                close();
            }
            current.push(comment);
            currentTokens += tokens;
        }
    }
    close();
    return batches;
}

// Keeps the first `percent` of the comments in thread order, which is Hacker News's own ranking with
// the best-rated top-level threads first. Since the order is depth-first, every reply's parent is in the share.
function selectCommentShare(comments, percent) {
    if (!Number.isFinite(percent) || percent < 0 || percent > 100) {
        throw new Error(`percent must be between 0 and 100, got ${percent}`);
    }
    return comments.slice(0, Math.ceil((comments.length * percent) / 100));
}

// The thread as the pipeline sees it: the same thread restricted to the top share of its comments.
function threadShare(thread, percent) {
    return { ...thread, comments: selectCommentShare(thread.comments, percent) };
}

function estimateRunCost(comments, ratePerThousandTokensUsd) {
    const tokens = totalCommentTokens(comments);
    return { tokens, usd: (ratePerThousandTokensUsd * tokens) / 1000 };
}

// The largest percentage of top comments whose forecast cost stays within budgetUsd; 0 when even one comment does not fit.
function largestShareWithinBudget(comments, ratePerThousandTokensUsd, budgetUsd) {
    for (let percent = 100; percent > 0; percent -= 1) {
        if (estimateRunCost(selectCommentShare(comments, percent), ratePerThousandTokensUsd).usd <= budgetUsd) {
            return percent;
        }
    }
    return 0;
}

function storySearchUrl(query) {
    return CONSTANTS.HN_STORY_SEARCH_URL + encodeURIComponent(query);
}

function isThreadId(text) {
    return /^\d+$/.test(text);
}

// Fetches JSON from the Hacker News API; `what` names the request in the error message.
async function fetchHnJson(url, what) {
    const response = await globalThis.fetch(url);
    if (!response.ok) {
        throw new Error(`Hacker News API returned HTTP ${response.status} for ${what}`);
    }
    return response.json();
}

function fetchThreadItem(threadId) {
    return fetchHnJson(CONSTANTS.HN_ITEM_URL + threadId, `thread ${threadId}`);
}

async function fetchStories(url, what) {
    return parseFrontPage(await fetchHnJson(url, what));
}

// Parses Algolia search hits (front page or story search) into { id, title, numComments }.
function parseFrontPage(json) {
    if (!json || !Array.isArray(json.hits)) {
        throw new Error('front page response has no hits array');
    }
    const stories = [];
    for (const hit of json.hits) {
        const id = Number(hit && hit.objectID);
        if (!Number.isInteger(id)) {
            continue;
        }
        stories.push({
            id,
            title: String(hit.title || ''),
            numComments: Number.isFinite(hit.num_comments) ? hit.num_comments : 0,
            createdAt: typeof hit.created_at === 'string' ? hit.created_at : null,
        });
    }
    return stories;
}

const DATE_ONLY_LENGTH = 'YYYY-MM-DD'.length;

// The facts that tell stories apart: comment count, posting date, id. Shown after the title in the list.
function storyDate(story) {
    return story.createdAt ? story.createdAt.slice(0, DATE_ONLY_LENGTH) : 'unknown date';
}

function storyDetails(story) {
    return `(${story.numComments} comments, ${storyDate(story)}, ${story.id})`;
}

function storyLabel(story) {
    return `${story.title} ${storyDetails(story)}`;
}

// Newest first; undated stories last.
function sortStoriesNewestFirst(stories) {
    return stories.slice().sort((left, right) => (right.createdAt || '').localeCompare(left.createdAt || ''));
}

function makeScoreBatches(comments, batchSize) {
    const batches = [];
    for (let start = 0; start < comments.length; start += batchSize) {
        batches.push(comments.slice(start, start + batchSize));
    }
    return batches;
}

function mulberry32(seed) {
    let state = seed >>> 0;
    return function next() {
        state = (state + 0x6D2B79F5) >>> 0;
        let mixed = Math.imul(state ^ (state >>> 15), 1 | state);
        mixed = (mixed + Math.imul(mixed ^ (mixed >>> 7), 61 | mixed)) ^ mixed;
        return ((mixed ^ (mixed >>> 14)) >>> 0) / 4294967296;
    };
}

function seededShuffle(items, seed) {
    const copy = items.slice();
    const random = mulberry32(seed);
    for (let position = copy.length - 1; position > 0; position -= 1) {
        const swapIndex = Math.floor(random() * (position + 1));
        const held = copy[position];
        copy[position] = copy[swapIndex];
        copy[swapIndex] = held;
    }
    return copy;
}

// ---------------------------------------------------------------------------
// Prompts and schemas
// ---------------------------------------------------------------------------

const EXTRACT_SYSTEM_PROMPT = `You analyze a Hacker News comment thread. The submission title is: "{title}".

Task: from the batch of comments below, list the bipolar axes of disagreement that appear in it.

An axis is a pair of incompatible statements about the same specific thing, such that one commenter could hold the first and another the second. Examples of statements that anchor an axis: "the safeguard fallback fires on ordinary coding work", "Codex subscription quota lasts longer than Claude's", "text watermarking degrades output quality". An overall verdict on the subject also counts when phrased as a statement ("the release is a worthwhile upgrade"). Examples that do not count: topics ("pricing"), mood statements without a claim about the subject ("I'm disappointed"), traits of the commenter ("uses the API rather than a subscription").

For each axis output:
- statementA: one full sentence stating one side's claim.
- statementB: one full sentence stating the rival or opposite claim about the same thing. The two statements must be incompatible, so a commenter can hold at most one of them, and each must be understandable on its own.
- commentsA: ids of comments in this batch that clearly hold statement A.
- commentsB: ids of comments in this batch that clearly hold statement B.

Rules:
- Include an axis when at least one comment clearly takes a side and a reasonable commenter could take the other side.
- Prefer specific, concrete propositions over broad ones. Split distinct claims into separate axes.
- A line inside a comment that begins with ">" quotes another comment or the article and is not the commenter's own claim.
- Words that only agree or disagree with the parent ("this", "exactly", "+1", "same here", "no", "wrong") state no position; list a reply under a statement only for a claim the rest of its own text makes.
- Use only comment ids that appear in the batch. A comment may appear under several axes.
- Do not list a comment under both poles of the same axis.
- Return JSON matching the schema and nothing else.`;

const CONSOLIDATE_SYSTEM_PROMPT = `You are consolidating candidate axes of disagreement extracted from a Hacker News thread. The submission title is: "{title}". Candidates were extracted from separate batches of comments and overlap heavily. Each candidate shows how many comments held each pole (nA, nB).

Produce one canonical axis per distinct disagreement in the thread, however many that is. There is no target count: do not split one disagreement into facets to make more axes, and do not blur different disagreements together to make fewer.

Rules:
- Two candidates are the same disagreement when a commenter holding side A of one would almost certainly hold side A of the other. Merge such candidates into one axis, including pairs listed in the opposite order and candidates that state one facet, cause, or consequence of the same disagreement. Word the merged axis after the candidate with the most comments.
- Keep candidates apart only when commenters could plausibly split differently on them.
- Each axis: statementA and statementB, each one full sentence about the same specific thing, the two incompatible with each other so a commenter can hold at most one, and each understandable on its own.
- Exclude topics, mood statements without a claim about the subject, and traits of commenters. Keep whole-subject verdict axes when phrased as statements ("the release is a worthwhile upgrade" versus "the release is not a meaningful upgrade").
- Order the axes from most contested to least contested.
- Return JSON matching the schema and nothing else.`;

const SCORE_SYSTEM_PROMPT = `You classify Hacker News comments against a fixed list of axes. The submission title is: "{title}".

Each axis is a pair of rival statements labeled A and B. For each comment, and for each axis that the comment clearly takes a position on, output one stance:
- "A" if the comment holds statement A,
- "B" if the comment holds statement B,
- "M" if the comment explicitly addresses the question the two statements answer but takes a middle, mixed, or it-depends position.

Rules:
- Skip axes the comment does not address. Most comments address zero, one, or two axes.
- A comment addresses an axis only when its position is clear from its own text. A parent snippet, when one is given, has a single job: to resolve what the comment refers to, such as a pronoun or an omitted subject. The parent's position is never read as the comment's own. Do not infer a stance from tone or from the author.
- Words that only agree or disagree with the parent ("this", "exactly", "+1", "same here", "no", "wrong") state no position. Judge the rest of the comment's text as if those words were absent, and give no stance when nothing else is left.
- A line inside a comment that begins with ">" quotes another comment or the article and is not the commenter's own claim. A comment whose own words only accept or reject a quoted line gets no stance.
- A position the comment attributes to someone else ("people say", "the article claims") is not the comment's own.
- "M" is not for a comment whose position is unclear, and not for a comment that holds one statement while granting a point to the other, which is still "A" or "B".
- Use only the comment ids given in the batch and the axis numbers given below.
- Return JSON matching the schema and nothing else.

Axes:
{axes}`;

const EXTRACT_SCHEMA = {
    name: 'extract_axes',
    schema: {
        type: 'object',
        properties: {
            candidates: {
                type: 'array',
                items: {
                    type: 'object',
                    properties: {
                        statementA: { type: 'string' },
                        statementB: { type: 'string' },
                        commentsA: { type: 'array', items: { type: 'integer' } },
                        commentsB: { type: 'array', items: { type: 'integer' } },
                    },
                    required: ['statementA', 'statementB', 'commentsA', 'commentsB'],
                    additionalProperties: false,
                },
            },
        },
        required: ['candidates'],
        additionalProperties: false,
    },
};

const CONSOLIDATE_SCHEMA = {
    name: 'consolidate_axes',
    schema: {
        type: 'object',
        properties: {
            axes: {
                type: 'array',
                items: {
                    type: 'object',
                    properties: {
                        statementA: { type: 'string' },
                        statementB: { type: 'string' },
                    },
                    required: ['statementA', 'statementB'],
                    additionalProperties: false,
                },
            },
        },
        required: ['axes'],
        additionalProperties: false,
    },
};

const SCORE_SCHEMA = {
    name: 'score_stances',
    schema: {
        type: 'object',
        properties: {
            stances: {
                type: 'array',
                items: {
                    type: 'object',
                    properties: {
                        comment: { type: 'integer' },
                        axis: { type: 'integer' },
                        stance: { type: 'string', enum: [STANCE_A, STANCE_B, STANCE_M] },
                    },
                    required: ['comment', 'axis', 'stance'],
                    additionalProperties: false,
                },
            },
        },
        required: ['stances'],
        additionalProperties: false,
    },
};

function fillTemplate(template, values) {
    return template.replace(/\{(\w+)\}/g, (whole, name) => (Object.prototype.hasOwnProperty.call(values, name) ? values[name] : whole));
}

function formatCommentForExtract(comment) {
    const replyPart = comment.depth > 0 ? `, re ${comment.parentId}` : '';
    return `[id ${comment.id}${replyPart}]\n${comment.text}`;
}

function buildExtractMessages(title, batch) {
    return [
        { role: 'system', content: fillTemplate(EXTRACT_SYSTEM_PROMPT, { title }) },
        { role: 'user', content: 'Comments:\n\n' + batch.map(formatCommentForExtract).join('\n\n') },
    ];
}

function buildConsolidateMessages(title, candidates) {
    const lines = candidates.map((candidate, index) =>
        `#${index + 1} [nA=${candidate.commentsA.length}, nB=${candidate.commentsB.length}] A: ${candidate.statementA} | B: ${candidate.statementB}`);
    return [
        { role: 'system', content: fillTemplate(CONSOLIDATE_SYSTEM_PROMPT, { title }) },
        { role: 'user', content: 'Candidates:\n\n' + lines.join('\n') },
    ];
}

function truncateText(text, maxChars) {
    return text.length > maxChars ? text.slice(0, maxChars) + '...' : text;
}

// A line a parent quotes (starting with ">") is someone else's words, so the excerpt skips such lines;
// otherwise a reply to a comment that opens with a quote is shown the grandparent's claim as its parent's.
// A parent made only of quoted lines keeps its text, so the reply still has something to resolve against.
function parentExcerptSource(text) {
    const ownLines = text.split('\n').filter(line => !line.trimStart().startsWith('>')).join('\n').trim();
    return ownLines === '' ? text : ownLines;
}

function formatCommentForScore(comment, commentsById, snippetChars) {
    const parent = commentsById.get(comment.parentId);
    const parentPart = parent
        ? `, replying to ${parent.id}: "${truncateText(parentExcerptSource(parent.text).replace(/\s+/g, ' '), snippetChars)}"`
        : '';
    return `[id ${comment.id}${parentPart}]\n${comment.text}`;
}

// The scoring system message depends only on the pass, so the pipeline builds it once per pass.
function buildScoreSystemMessage(title, presentedAxes, swapPoles) {
    const axisLines = presentedAxes.map((axis, index) => {
        const shownA = swapPoles ? axis.statementB : axis.statementA;
        const shownB = swapPoles ? axis.statementA : axis.statementB;
        return `${index + 1}. A: ${shownA} | B: ${shownB}`;
    });
    return { role: 'system', content: fillTemplate(SCORE_SYSTEM_PROMPT, { title, axes: axisLines.join('\n') }) };
}

function buildScoreUserMessage(batch, commentsById, snippetChars) {
    return { role: 'user', content: 'Comments:\n\n' + batch.map(comment => formatCommentForScore(comment, commentsById, snippetChars)).join('\n\n') };
}

function buildScoreMessages(title, presentedAxes, batch, commentsById, swapPoles, snippetChars) {
    return [buildScoreSystemMessage(title, presentedAxes, swapPoles), buildScoreUserMessage(batch, commentsById, snippetChars)];
}

// ---------------------------------------------------------------------------
// Response parsing
// ---------------------------------------------------------------------------

function toCommentId(value) {
    const number = Number(value);
    return Number.isInteger(number) ? number : null;
}

function filterCommentIds(list, validIds, warnings, label) {
    const kept = [];
    for (const raw of Array.isArray(list) ? list : []) {
        const commentId = toCommentId(raw);
        if (commentId === null || !validIds.has(commentId)) {
            warnings.push(`${label}: unknown comment id ${JSON.stringify(raw)}`);
            continue;
        }
        kept.push(commentId);
    }
    return kept;
}

const ERROR_EXCERPT_CHARS = 300;

// Short quote of a model response for error messages, so a malformed shape is visible without logging.
function describeJson(json) {
    return truncateText(JSON.stringify(json), ERROR_EXCERPT_CHARS);
}

// A model response that parsed as JSON but does not match any accepted shape.
class InvalidResponseError extends Error {
    constructor(message) {
        super(message);
        this.name = 'InvalidResponseError';
    }
}

// Returns the list a stage expects from the model. The first key is the schema's; the others are
// aliases some providers have used. A bare array is also accepted. Deviations are recorded as warnings
// so they stay visible; anything else is an InvalidResponseError.
function readPayloadList(json, keys, stageLabel, warnings) {
    const [schemaKey, ...aliases] = keys;
    if (Array.isArray(json)) {
        warnings.push(`${stageLabel}: model returned a bare array instead of {"${schemaKey}": [...]}; accepted`);
        return json;
    }
    if (json && Array.isArray(json[schemaKey])) {
        return json[schemaKey];
    }
    const alias = aliases.find(key => json && Array.isArray(json[key]));
    if (alias !== undefined) {
        warnings.push(`${stageLabel}: model returned "${alias}" instead of "${schemaKey}"; accepted`);
        return json[alias];
    }
    throw new InvalidResponseError(`${stageLabel} response has no ${schemaKey} array: ${describeJson(json)}`);
}

// Some models answer the scoring request as one object per comment holding an axis-to-stance map.
// The map has been seen under "stances" and under "axes"; the comment id under "id" or "comment".
const PER_COMMENT_MAP_KEYS = ['stances', 'axes'];

function perCommentMap(item) {
    if (!item || typeof item !== 'object') {
        return null;
    }
    const key = PER_COMMENT_MAP_KEYS.find(candidate => item[candidate] && typeof item[candidate] === 'object' && !Array.isArray(item[candidate]));
    return key === undefined ? null : item[key];
}

function flattenPerCommentList(list, warnings) {
    const flat = [];
    let flattened = false;
    for (const item of list) {
        const map = perCommentMap(item);
        if (map === null) {
            flat.push(item);
            continue;
        }
        flattened = true;
        const commentId = item.id === undefined ? item.comment : item.id;
        for (const [axisNumber, stance] of Object.entries(map)) {
            flat.push({ comment: commentId, axis: Number(axisNumber), stance });
        }
    }
    if (flattened) {
        warnings.push('score: model returned per-comment objects with axis-to-stance maps instead of a stances list; flattened');
    }
    return flat;
}

// Shared by extraction and consolidation: a list of statement pairs, each turned into an item.
function parseStatementList(json, key, stageLabel, itemNoun, buildItem) {
    const items = [];
    const warnings = [];
    readPayloadList(json, [key], stageLabel, warnings).forEach((raw, index) => {
        const statements = readStatementPair(raw);
        if (statements === null) {
            warnings.push(`${stageLabel}: ${itemNoun} ${index + 1} is missing a statement`);
            return;
        }
        items.push(buildItem(raw, statements, items.length, warnings));
    });
    return { items, warnings };
}

// Returns { statementA, statementB } with trimmed text, or null when either statement is missing.
function readStatementPair(raw) {
    const statementA = typeof raw.statementA === 'string' ? raw.statementA.trim() : '';
    const statementB = typeof raw.statementB === 'string' ? raw.statementB.trim() : '';
    if (statementA === '' || statementB === '') {
        return null;
    }
    return { statementA, statementB };
}

const CANDIDATE_LABEL_CHARS = 60;

function parseExtractResponse(json, validIds) {
    const { items, warnings } = parseStatementList(json, 'candidates', 'extract', 'candidate', (raw, statements, index, itemWarnings) => {
        const label = `extract: candidate "${truncateText(statements.statementA, CANDIDATE_LABEL_CHARS)}"`;
        return {
            ...statements,
            commentsA: filterCommentIds(raw.commentsA, validIds, itemWarnings, label),
            commentsB: filterCommentIds(raw.commentsB, validIds, itemWarnings, label),
        };
    });
    return { candidates: items, warnings };
}

function parseConsolidateResponse(json) {
    const { items, warnings } = parseStatementList(json, 'axes', 'consolidate', 'axis', (raw, statements, index) => ({ id: index + 1, ...statements }));
    return { axes: items, warnings };
}

function flipStance(stance) {
    if (stance === STANCE_A) return STANCE_B;
    if (stance === STANCE_B) return STANCE_A;
    return stance;
}

function stanceKey(commentId, axisId) {
    return `${commentId}|${axisId}`;
}

function parseStanceKey(key) {
    const parts = key.split('|');
    return { commentId: Number(parts[0]), axisId: Number(parts[1]) };
}

function parseScoreResponse(json, validIds, presentedAxes, swapPoles) {
    const stances = new Map();
    const warnings = [];
    const list = flattenPerCommentList(readPayloadList(json, ['stances', 'classifications'], 'score', warnings), warnings);
    for (const raw of list) {
        const commentId = toCommentId(raw.comment);
        if (commentId === null || !validIds.has(commentId)) {
            warnings.push(`score: unknown comment id ${JSON.stringify(raw.comment)}`);
            continue;
        }
        const axisNumber = Number(raw.axis);
        if (!Number.isInteger(axisNumber) || axisNumber < 1 || axisNumber > presentedAxes.length) {
            warnings.push(`score: comment ${commentId} names unknown axis ${JSON.stringify(raw.axis)}`);
            continue;
        }
        if (!VALID_STANCES.has(raw.stance)) {
            warnings.push(`score: comment ${commentId} has invalid stance ${JSON.stringify(raw.stance)}`);
            continue;
        }
        const axis = presentedAxes[axisNumber - 1];
        const key = stanceKey(commentId, axis.id);
        if (stances.has(key)) {
            warnings.push(`score: duplicate stance for comment ${commentId} on axis ${axis.id}`);
            continue;
        }
        stances.set(key, swapPoles ? flipStance(raw.stance) : raw.stance);
    }
    return { stances, warnings };
}

// ---------------------------------------------------------------------------
// Aggregation
// ---------------------------------------------------------------------------

// Keeps the stances on which both scoring passes agree.
function mergePasses(pass1, pass2) {
    const agreed = new Map();
    for (const [key, stance] of pass1) {
        if (pass2.get(key) === stance) {
            agreed.set(key, stance);
        }
    }
    return agreed;
}

function majorityStance(tally) {
    const best = Math.max(tally[STANCE_A], tally[STANCE_B], tally[STANCE_M]);
    const winners = [STANCE_A, STANCE_B, STANCE_M].filter(stance => tally[stance] === best);
    return winners.length === 1 ? winners[0] : STANCE_M;
}

function aggregateByAuthor(agreed, commentsById) {
    const tallies = new Map();
    for (const [key, stance] of agreed) {
        const { commentId, axisId } = parseStanceKey(key);
        const comment = commentsById.get(commentId);
        if (!comment) {
            throw new Error(`stance refers to unknown comment ${commentId}`);
        }
        if (!tallies.has(axisId)) {
            tallies.set(axisId, new Map());
        }
        const authorTallies = tallies.get(axisId);
        if (!authorTallies.has(comment.author)) {
            authorTallies.set(comment.author, { [STANCE_A]: 0, [STANCE_B]: 0, [STANCE_M]: 0 });
        }
        authorTallies.get(comment.author)[stance] += 1;
    }
    const byAuthor = new Map();
    for (const [axisId, authorTallies] of tallies) {
        const stancesForAxis = new Map();
        for (const [author, tally] of authorTallies) {
            stancesForAxis.set(author, majorityStance(tally));
        }
        byAuthor.set(axisId, stancesForAxis);
    }
    return byAuthor;
}

// One row per axis: commenters on each statement and in the middle, their total, and the agreed comments.
function computeRows(axes, byAuthor, agreed) {
    const commentCounts = new Map();
    for (const key of agreed.keys()) {
        const { axisId } = parseStanceKey(key);
        commentCounts.set(axisId, (commentCounts.get(axisId) || 0) + 1);
    }
    return axes.map(axis => {
        const authorStances = byAuthor.get(axis.id) || new Map();
        let countA = 0;
        let countB = 0;
        let countM = 0;
        for (const stance of authorStances.values()) {
            if (stance === STANCE_A) countA += 1;
            else if (stance === STANCE_B) countB += 1;
            else countM += 1;
        }
        return {
            axisId: axis.id,
            statementA: axis.statementA,
            statementB: axis.statementB,
            countA,
            countB,
            countM,
            authors: countA + countB + countM,
            comments: commentCounts.get(axis.id) || 0,
        };
    });
}

// Splits `cells` among the three counts by largest remainder, so the parts always sum to `cells`.
function barCells(countA, countM, countB, cells) {
    const counts = [countA, countM, countB];
    const total = countA + countM + countB;
    if (total === 0) {
        return [0, 0, 0];
    }
    const quotas = counts.map(count => (cells * count) / total);
    const parts = quotas.map(quota => Math.floor(quota));
    let remaining = cells - parts.reduce((sum, part) => sum + part, 0);
    const order = [0, 1, 2].sort((left, right) => (quotas[right] - parts[right]) - (quotas[left] - parts[left]) || left - right);
    for (const index of order) {
        if (remaining === 0) break;
        parts[index] += 1;
        remaining -= 1;
    }
    return parts;
}

function splitBar(row, cells) {
    const [cellsA, cellsM, cellsB] = barCells(row.countA, row.countM, row.countB, cells);
    if (cellsA + cellsM + cellsB === 0) {
        return ' '.repeat(cells);
    }
    return '<'.repeat(cellsA) + '-'.repeat(cellsM) + '>'.repeat(cellsB);
}

// Shares of side 1, middle, and side 2 among all commenters on the axis; all zero when there are none.
function proportionShares(row) {
    const total = row.countA + row.countM + row.countB;
    return total === 0 ? [0, 0, 0] : [row.countA / total, row.countM / total, row.countB / total];
}

// Display helpers shared by the page and the headless runner. All return plain strings.
const COST_DIGITS = 4;
const SECONDS_SHOWN_AS_SECONDS_LIMIT = 90;
const SECONDS_PER_MINUTE = 60;

function formatSplit(row) {
    return `${row.countA} ${splitBar(row, CONSTANTS.BAR_CELLS)} ${row.countB}`;
}

function formatDuration(seconds) {
    return seconds < SECONDS_SHOWN_AS_SECONDS_LIMIT ? `${Math.round(seconds)} seconds` : `${Math.round(seconds / SECONDS_PER_MINUTE)} minutes`;
}

// A time already spent is reported to the second, so that a counter that ticks once a second keeps
// changing past a minute. A forecast stays rounded, since its precision does not go that far.
function formatElapsed(seconds) {
    const whole = Math.round(seconds);
    if (whole < SECONDS_PER_MINUTE) {
        return `${whole} seconds`;
    }
    return `${Math.floor(whole / SECONDS_PER_MINUTE)} minutes ${whole % SECONDS_PER_MINUTE} seconds`;
}

function formatProgress(update) {
    return `${update.stage}: ${update.done}/${update.total} done, ${update.inFlight} in flight, ${update.calls} calls (${update.cachedCalls} from cache), $${update.cost.toFixed(COST_DIGITS)} spent`;
}

const SUMMARY_COST_DIGITS = 2;

function formatRunCost(result) {
    return `$${result.cost.toFixed(SUMMARY_COST_DIGITS)}, ${result.calls} model calls (${result.stats.cachedCalls} cached)`;
}

// What came out and why the counts are lower than the comment count.
function formatRunSummary(result) {
    const stats = result.stats;
    return [
        `${result.rows.length} rows from ${stats.comments} comments by ${stats.authors} commenters.`,
        `${stats.agreedStances} of ${stats.classifiedPairs} classifications matched between the two scoring passes; only matching ones count.`,
    ];
}

// The side with more commenters is always statement 1, so the larger arm of the split is on the left.
function orientRows(rows) {
    return rows.map(row => (row.countB > row.countA
        ? { ...row, statementA: row.statementB, statementB: row.statementA, countA: row.countB, countB: row.countA }
        : row));
}

// Biggest axes first: by agreed comments, then commenters, then axis id.
// Ties on both counts fall back to the statement text, so the consolidator's output order never decides a rank.
function rankRows(rows) {
    const sorted = rows.slice().sort((left, right) =>
        right.comments - left.comments
        || right.authors - left.authors
        || left.statementA.localeCompare(right.statementA));
    return sorted.map((row, index) => ({ ...row, rank: index + 1 }));
}

// ---------------------------------------------------------------------------
// Concurrency and OpenRouter client
// ---------------------------------------------------------------------------

async function runPool(tasks, concurrency) {
    const results = new Array(tasks.length);
    let nextIndex = 0;
    let failed = false;
    async function worker() {
        while (!failed) {
            const index = nextIndex;
            nextIndex += 1;
            if (index >= tasks.length) {
                return;
            }
            try {
                results[index] = await tasks[index]();
            } catch (error) {
                failed = true;
                throw error;
            }
        }
    }
    const workerCount = Math.max(1, Math.min(concurrency, tasks.length));
    await Promise.all(Array.from({ length: workerCount }, worker));
    return results;
}

function defaultSleep(milliseconds) {
    return new Promise(resolve => setTimeout(resolve, milliseconds));
}

async function readErrorMessage(response) {
    try {
        const data = await response.json();
        if (data && data.error && data.error.message) {
            return data.error.message;
        }
        return JSON.stringify(data);
    } catch (parseError) {
        return `(unreadable error body: ${parseError.message})`;
    }
}

class TruncationError extends Error {
    constructor(message, usage) {
        super(message);
        this.name = 'TruncationError';
        this.usage = usage;
    }
}

function readUsage(data, model) {
    const usage = data.usage || {};
    if (typeof usage.cost !== 'number') {
        throw new Error(`OpenRouter response lacks usage.cost (${model}); cannot track spend`);
    }
    return { promptTokens: usage.prompt_tokens || 0, completionTokens: usage.completion_tokens || 0, cost: usage.cost };
}

function parseJsonContent(content) {
    if (typeof content !== 'string') {
        throw new Error('completion content is not a string');
    }
    const trimmed = content.trim().replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/, '');
    return JSON.parse(trimmed);
}

// The system prompt is the stable prefix of every call in a stage; marking it cacheable lets
// providers with prompt caching (Anthropic) bill repeated reads at the cached rate.
function markSystemMessageCacheable(message) {
    if (message.role !== 'system' || typeof message.content !== 'string') {
        return message;
    }
    return { role: 'system', content: [{ type: 'text', text: message.content, cache_control: { type: 'ephemeral' } }] };
}

async function callOpenRouter({ apiKey, request, signal, fetchImpl, sleepImpl }) {
    const fetchFunction = fetchImpl || globalThis.fetch;
    const sleepFunction = sleepImpl || defaultSleep;
    const body = {
        model: request.model,
        messages: request.messages.map(markSystemMessageCacheable),
        ...(request.sampling || {}),
        max_tokens: request.maxTokens,
        response_format: { type: 'json_schema', json_schema: { name: request.schema.name, strict: true, schema: request.schema.schema } },
        ...(request.reasoning ? { reasoning: request.reasoning } : {}),
        usage: { include: true },
        provider: { require_parameters: true },
    };
    let lastError = null;
    for (let attempt = 1; attempt <= CONSTANTS.MAX_ATTEMPTS; attempt += 1) {
        if (attempt > 1) {
            await sleepFunction(CONSTANTS.RETRY_BASE_MS * Math.pow(2, attempt - 2));
        }
        let response;
        try {
            response = await fetchFunction(CONSTANTS.OPENROUTER_URL, {
                method: 'POST',
                headers: { Authorization: `Bearer ${apiKey}`, 'Content-Type': 'application/json' },
                body: JSON.stringify(body),
                signal,
            });
        } catch (networkError) {
            if (signal && signal.aborted) {
                throw networkError;
            }
            lastError = new Error(`OpenRouter request failed (${request.model}): ${networkError.message}`);
            continue;
        }
        if (response.status === 429 || response.status >= 500) {
            lastError = new Error(`OpenRouter HTTP ${response.status} (${request.model}): ${await readErrorMessage(response)}`);
            continue;
        }
        if (!response.ok) {
            throw new Error(`OpenRouter HTTP ${response.status} (${request.model}): ${await readErrorMessage(response)}`);
        }
        const data = await response.json();
        if (data.error) {
            lastError = new Error(`OpenRouter error (${request.model}): ${data.error.message || JSON.stringify(data.error)}`);
            continue;
        }
        const choice = data.choices && data.choices[0];
        if (!choice || !choice.message) {
            lastError = new Error(`OpenRouter response has no choices (${request.model})`);
            continue;
        }
        const usage = readUsage(data, request.model);
        if (choice.finish_reason === 'length') {
            throw new TruncationError(`OpenRouter completion truncated at max_tokens=${request.maxTokens} (${request.model}, ${usage.completionTokens} completion tokens)`, usage);
        }
        let json;
        try {
            json = parseJsonContent(choice.message.content);
        } catch (parseError) {
            lastError = new Error(`OpenRouter content is not valid JSON (${request.model}): ${parseError.message}`);
            continue;
        }
        return { json, usage };
    }
    throw new Error(`${lastError.message} (gave up after ${CONSTANTS.MAX_ATTEMPTS} attempts)`);
}

// ---------------------------------------------------------------------------
// OpenRouter PKCE sign-in: the page sends the user to OpenRouter with a code challenge, gets a
// code back on its callback URL, and exchanges code plus verifier for an API key. No secret, no server.
// ---------------------------------------------------------------------------

const PKCE_VERIFIER_BYTES = 32;

function base64UrlEncode(bytes) {
    let binary = '';
    for (const byte of bytes) {
        binary += String.fromCharCode(byte);
    }
    return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function makePkceVerifier() {
    const bytes = new Uint8Array(PKCE_VERIFIER_BYTES);
    globalThis.crypto.getRandomValues(bytes);
    return base64UrlEncode(bytes);
}

async function pkceChallenge(verifier) {
    const digest = await globalThis.crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier));
    return base64UrlEncode(new Uint8Array(digest));
}

function openRouterAuthUrl(callbackUrl, challenge) {
    const url = new URL(CONSTANTS.OPENROUTER_AUTH_URL);
    url.searchParams.set('callback_url', callbackUrl);
    url.searchParams.set('code_challenge', challenge);
    url.searchParams.set('code_challenge_method', 'S256');
    return url.toString();
}

async function exchangeOpenRouterCode({ code, verifier, fetchImpl }) {
    const response = await (fetchImpl || globalThis.fetch)(CONSTANTS.OPENROUTER_KEY_EXCHANGE_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code, code_verifier: verifier, code_challenge_method: 'S256' }),
    });
    if (!response.ok) {
        throw new Error(`OpenRouter key exchange returned HTTP ${response.status}: ${await readErrorMessage(response)}`);
    }
    const data = await response.json();
    if (typeof data.key !== 'string' || data.key === '') {
        throw new Error(`OpenRouter key exchange returned no key: ${describeJson(data)}`);
    }
    return data.key;
}

// The pipeline's callChat over OpenRouter with one key; the signal the pipeline stamps on each call
// aborts in-flight requests.
function makeOpenRouterCallChat({ apiKey }) {
    return call => callOpenRouter({ apiKey, request: call, signal: call.signal });
}

// ---------------------------------------------------------------------------
// Result cache: reuse finished model calls across runs of the same request.
// ---------------------------------------------------------------------------

const FNV_OFFSET_BASIS = 0x811c9dc5;
const FNV_PRIME = 0x01000193;

// FNV-1a over the text, forwards or backwards; the two directions give two independent 32-bit hashes.
function fnv1a32(text, backwards) {
    let hash = FNV_OFFSET_BASIS;
    for (let step = 0; step < text.length; step += 1) {
        const index = backwards ? text.length - 1 - step : step;
        hash ^= text.charCodeAt(index);
        hash = Math.imul(hash, FNV_PRIME) >>> 0;
    }
    return hash.toString(16).padStart(8, '0');
}

// Key covers everything that determines the model's answer; meta and signal are excluded.
function requestCacheKey(call) {
    const material = JSON.stringify({
        model: call.model,
        messages: call.messages,
        schema: call.schema,
        sampling: call.sampling || null,
        reasoning: call.reasoning || null,
        maxTokens: call.maxTokens,
    });
    return `${fnv1a32(material, false)}${fnv1a32(material, true)}-${material.length.toString(16)}`;
}

// A stored response replayed: the same JSON, no cost, flagged as cached.
function cachedResponse(hit) {
    return { json: hit.json, usage: { ...hit.usage, cost: 0, cached: true } };
}

// store: { get(key) -> value | undefined, set(key, value) }; either may be synchronous or return a
// promise. A set that returns false (browser storage full) marks the response so the pipeline can count it.
function makeCachedCallChat(callChat, store) {
    return async function cachedCallChat(call) {
        const key = requestCacheKey(call);
        const hit = await store.get(key);
        if (hit) {
            return cachedResponse(hit);
        }
        const response = await callChat(call);
        const stored = await store.set(key, { json: response.json, usage: response.usage });
        return stored === false ? { ...response, usage: { ...response.usage, cacheWriteFailed: true } } : response;
    };
}

// Placeholder responses let the pipeline keep building later requests after a cache miss. They are
// valid but empty, so no truncation or shape error can occur while probing.
const PROBE_PLACEHOLDER_STATEMENTS = { statementA: 'placeholder', statementB: 'placeholder' };
const PROBE_PLACEHOLDER_RESPONSES = Object.freeze({
    extract: { candidates: [{ ...PROBE_PLACEHOLDER_STATEMENTS, commentsA: [], commentsB: [] }] },
    consolidate: { axes: [PROBE_PLACEHOLDER_STATEMENTS] },
    score: { stances: [] },
});
const PROBE_PLACEHOLDER_USAGE = Object.freeze({ promptTokens: 0, completionTokens: 0, cost: 0 });

// Thrown by the probe at the first call of a stage after the first stage with a miss, so the pipeline
// stops before building and hashing requests the result leaves out.
const PROBE_STOP = new Error('probe stopped after the first stage with a miss');

// Counts, stage by stage, how many of a run's model calls the store already holds, without calling any
// model. Stages after the first stage with a miss are left out of the result, because their requests
// depend on the missing responses; complete is true when every call of every stage is cached.
async function probeCache({ thread, store, config }) {
    const counts = new Map(STAGE_ORDER.map(stage => [stage, { stage, hits: 0, total: 0 }]));
    let missedStage = null;
    async function probingCallChat(call) {
        if (missedStage !== null && call.stage !== missedStage) {
            throw PROBE_STOP;
        }
        const count = counts.get(call.stage);
        count.total += 1;
        const hit = await store.get(requestCacheKey(call));
        if (hit) {
            count.hits += 1;
            return cachedResponse(hit);
        }
        missedStage = call.stage;
        return { json: PROBE_PLACEHOLDER_RESPONSES[call.stage], usage: PROBE_PLACEHOLDER_USAGE };
    }
    try {
        await runPipeline({ thread, callChat: probingCallChat, onProgress: () => {}, config });
    } catch (error) {
        if (error !== PROBE_STOP) {
            throw error;
        }
    }
    const stages = [];
    for (const stage of STAGE_ORDER) {
        const count = counts.get(stage);
        stages.push(count);
        if (count.hits < count.total) {
            break;
        }
    }
    return { stages, complete: stages.length === STAGE_ORDER.length && stages.every(count => count.hits === count.total) };
}

// Text for the estimate line: a clause when every call is cached, a sentence listing the cached calls
// per stage when some are, and nothing when none are.
function formatCacheProbe(probe) {
    const totalCalls = probe.stages.reduce((sum, stage) => sum + stage.total, 0);
    const totalHits = probe.stages.reduce((sum, stage) => sum + stage.hits, 0);
    if (probe.complete) {
        return `all ${totalCalls} model calls are cached`;
    }
    if (totalHits === 0) {
        return '';
    }
    const parts = probe.stages.map(stage => `${stage.hits} of ${stage.total} ${STAGE_BY_KEY[stage.stage].callName}`).join(', ');
    return `Cached: ${parts} calls, so it will cost and take less.`;
}

// The text after "Next run:" on the estimate line: the forecast, with the cached-call sentence when
// some calls are cached, or the zero-cost statement when all are. probe is null until the probe finishes.
function formatNextRun({ usd, seconds, probe }) {
    const cacheText = probe === null ? '' : formatCacheProbe(probe);
    if (probe !== null && probe.complete) {
        return `$0 and 0 seconds, ${cacheText}.`;
    }
    const forecast = `about $${usd.toFixed(SUMMARY_COST_DIGITS)} and about ${formatDuration(seconds)}.`;
    return cacheText === '' ? forecast : `${forecast} ${cacheText}`;
}

// ---------------------------------------------------------------------------
// Pipeline
// ---------------------------------------------------------------------------

async function runPipeline({ thread, callChat, onProgress, signal, config }) {
    const cfg = { ...DEFAULT_CONFIG, ...(config || {}) };
    const comments = thread.comments;
    if (comments.length === 0) {
        throw new Error('thread has no comments');
    }
    const commentsById = indexCommentsById(comments);
    const warnings = [];
    let cost = 0;
    let callCount = 0;
    let cachedCalls = 0;
    let cacheWriteFailures = 0;

    let inFlight = 0;
    let stage = { label: 'start', done: 0, total: 0 };

    // Progress goes out when a stage starts, a unit completes, and a model call starts or ends, so the
    // calls in flight are visible while a wave of parallel calls is still running.
    function emit() {
        onProgress({ stage: stage.label, done: stage.done, total: stage.total, inFlight, cost, calls: callCount, cachedCalls });
    }

    function report(label, done, total) {
        stage = { label, done, total };
        emit();
    }

    function addSpend(usage) {
        callCount += 1;
        if (usage.cached) {
            cachedCalls += 1;
        }
        if (usage.cacheWriteFailed) {
            cacheWriteFailures += 1;
        }
        cost += usage.cost;
        if (cost > cfg.budgetUsd) {
            throw new Error(`Budget of $${cfg.budgetUsd.toFixed(SUMMARY_COST_DIGITS)} exceeded: spent $${cost.toFixed(COST_DIGITS)} after ${callCount} calls`);
        }
    }

    async function callModel(call) {
        inFlight += 1;
        emit();
        let response;
        try {
            response = await callChat({ ...call, signal });
        } catch (error) {
            if (error instanceof TruncationError && error.usage) {
                addSpend(error.usage);
            }
            throw error;
        } finally {
            inFlight -= 1;
        }
        addSpend(response.usage);
        emit();
        return response;
    }

    // Runs one batch; when the model truncates or answers in an unknown shape, splits the batch in half and retries the halves.
    async function runSplittable(batch, runBatch, mergeResults, stageLabel) {
        try {
            return await runBatch(batch);
        } catch (error) {
            const splittable = error instanceof TruncationError || error instanceof InvalidResponseError;
            if (!splittable || batch.length < 2) {
                throw error;
            }
            const reason = error instanceof TruncationError ? 'truncated at max_tokens' : 'response of unknown shape';
            warnings.push(`${stageLabel}: batch of ${batch.length} comments (ids ${batch[0].id} to ${batch[batch.length - 1].id}) ${reason}; split in half`);
            const middle = Math.ceil(batch.length / 2);
            const [first, second] = await Promise.all([
                runSplittable(batch.slice(0, middle), runBatch, mergeResults, stageLabel),
                runSplittable(batch.slice(middle), runBatch, mergeResults, stageLabel),
            ]);
            return mergeResults(first, second);
        }
    }

    // Runs one stage's units through the pool with progress reporting and splitting. Each unit is
    // { batch, ...context }; runPart(part, unit) handles one (possibly split) part of the batch.
    async function runStage(label, units, runPart, mergeResults) {
        let done = 0;
        report(label, done, units.length);
        return runPool(units.map(unit => async () => {
            const result = await runSplittable(unit.batch, part => runPart(part, unit), mergeResults, label);
            done += 1;
            report(label, done, units.length);
            return result;
        }), cfg.concurrency);
    }

    // Stage 1: extract candidate axes per batch.
    const extractUnits = makeExtractBatches(comments, cfg.extractBatchTokens).map((batch, batchIndex) => ({ batch, batchIndex }));
    const mergeExtract = (first, second) => ({ candidates: [...first.candidates, ...second.candidates], warnings: [...first.warnings, ...second.warnings] });
    const extractResults = await runStage('extract', extractUnits, async (part, unit) => {
        const partIds = part.map(comment => comment.id);
        const response = await callModel({
            stage: 'extract',
            ...stageSettings(cfg, 'extract'),
            messages: buildExtractMessages(thread.title, part),
            schema: EXTRACT_SCHEMA,
            meta: { batchIndex: unit.batchIndex, commentIds: partIds },
        });
        return parseExtractResponse(response.json, new Set(partIds));
    }, mergeExtract);
    const candidates = [];
    for (const result of extractResults) {
        candidates.push(...result.candidates);
        warnings.push(...result.warnings);
    }
    if (candidates.length === 0) {
        throw new Error('extraction produced no candidate axes');
    }

    // Stage 2: consolidate candidates into canonical axes.
    report('consolidate', 0, 1);
    const consolidateResponse = await callModel({
        stage: 'consolidate',
        ...stageSettings(cfg, 'consolidate'),
        messages: buildConsolidateMessages(thread.title, candidates),
        schema: CONSOLIDATE_SCHEMA,
        meta: { candidateCount: candidates.length },
    });
    const consolidated = parseConsolidateResponse(consolidateResponse.json);
    warnings.push(...consolidated.warnings);
    const axes = consolidated.axes;
    if (axes.length === 0) {
        throw new Error('consolidation produced no axes');
    }
    report('consolidate', 1, 1);

    // Stage 3: score every comment against every axis, twice. The passes are independent, so both
    // run through one pool; pass 2 shuffles the axes and swaps the statements.
    const scoreBatches = makeScoreBatches(comments, cfg.scoreBatchComments);
    const passes = [
        { presentedAxes: axes, swapPoles: false },
        { presentedAxes: seededShuffle(axes, cfg.shuffleSeed), swapPoles: true },
    ].map(pass => ({ ...pass, systemMessage: buildScoreSystemMessage(thread.title, pass.presentedAxes, pass.swapPoles) }));
    const scoreUnits = passes.flatMap((pass, passIndex) => scoreBatches.map((batch, batchIndex) => ({ batch, batchIndex, passIndex, pass })));
    const mergeScore = (first, second) => ({ stances: new Map([...first.stances, ...second.stances]), warnings: [...first.warnings, ...second.warnings] });
    const scoreResults = await runStage('score', scoreUnits, async (part, unit) => {
        const partIds = part.map(comment => comment.id);
        const { pass } = unit;
        const response = await callModel({
            stage: 'score',
            ...stageSettings(cfg, 'score'),
            messages: [pass.systemMessage, buildScoreUserMessage(part, commentsById, cfg.parentSnippetChars)],
            schema: SCORE_SCHEMA,
            meta: { passIndex: unit.passIndex, batchIndex: unit.batchIndex, commentIds: partIds, presentedAxes: pass.presentedAxes, swapPoles: pass.swapPoles },
        });
        return parseScoreResponse(response.json, new Set(partIds), pass.presentedAxes, pass.swapPoles);
    }, mergeScore);
    const passMaps = passes.map(() => new Map());
    scoreResults.forEach((result, index) => {
        const target = passMaps[scoreUnits[index].passIndex];
        for (const [key, stance] of result.stances) {
            target.set(key, stance);
        }
        warnings.push(...result.warnings);
    });

    // Stage 4: aggregate.
    const agreed = mergePasses(passMaps[0], passMaps[1]);
    const byAuthor = aggregateByAuthor(agreed, commentsById);
    const rows = orientRows(rankRows(computeRows(axes, byAuthor, agreed)));
    if (cacheWriteFailures > 0) {
        warnings.push(`${cacheWriteFailures} cache writes failed (browser storage full); those calls will be repeated on a rerun`);
    }
    report('done', 1, 1);
    return {
        rows,
        axes,
        candidates,
        cost,
        calls: callCount,
        warnings,
        stats: {
            comments: comments.length,
            authors: new Set(comments.map(comment => comment.author)).size,
            cachedCalls,
            cacheWriteFailures,
            classifiedPairs: new Set([...passMaps[0].keys(), ...passMaps[1].keys()]).size,
            agreedStances: agreed.size,
        },
    };
}

if (typeof module !== 'undefined' && module.exports) {
    module.exports = {
        CONSTANTS, DEFAULT_CONFIG, VOLUME_MODELS, CONSOLIDATION_MODELS, DEFAULT_VOLUME_KEY, DEFAULT_CONSOLIDATION_KEY, volumeLabel, consolidationLabel, TOKENS_PER_COMMENT,
        roleChoice, buildStageConfig, combinedRate, estimateRunSeconds, applyToAllStages,
        stripHtml, flattenThread, estimateTokens, makeExtractBatches, makeScoreBatches, seededShuffle,
        selectCommentShare, threadShare, indexCommentsById, estimateRunCost, largestShareWithinBudget, parseFrontPage, storyDate, storyDetails, storyLabel, sortStoriesNewestFirst, storySearchUrl, isThreadId, fetchThreadItem, fetchStories,
        buildExtractMessages, buildConsolidateMessages, buildScoreMessages,
        parseExtractResponse, parseConsolidateResponse, parseScoreResponse,
        parseStanceKey, flipStance,
        mergePasses, aggregateByAuthor, computeRows, orientRows, rankRows, barCells, splitBar, proportionShares,
        formatSplit, formatDuration, formatElapsed, formatProgress, formatRunCost, formatRunSummary,
        runPool, callOpenRouter, makeOpenRouterCallChat, runPipeline, TruncationError, InvalidResponseError,
        requestCacheKey, makeCachedCallChat, probeCache, formatCacheProbe, formatNextRun,
        makePkceVerifier, pkceChallenge, openRouterAuthUrl, exchangeOpenRouterCode,
    };
}
</script>

<script id="page">
// Page glue: DOM only. All computation lives in the core script above.

// Rows are shown biggest first (agreed comments, then commenters), one block per axis: statement 1 above,
// statement 2 below, with a proportion bar between them flanked by each side's vote count.

// A JSON store over localStorage keys sharing one prefix. get returns null when absent; set returns
// false when the browser refuses the write (storage full or value too large) instead of throwing.
function makePrefixedStore(prefix) {
    return {
        get(key) {
            const raw = localStorage.getItem(prefix + key);
            return raw === null ? null : JSON.parse(raw);
        },
        has(key) {
            return localStorage.getItem(prefix + key) !== null;
        },
        set(key, value) {
            try {
                localStorage.setItem(prefix + key, JSON.stringify(value));
                return true;
            } catch (storageError) {
                return false;
            }
        },
        remove(key) {
            localStorage.removeItem(prefix + key);
        },
        // Full localStorage keys under the prefix.
        keys() {
            const found = [];
            for (let index = 0; index < localStorage.length; index += 1) {
                const key = localStorage.key(index);
                if (key.startsWith(prefix)) found.push(key);
            }
            return found;
        },
        count() {
            return this.keys().length;
        },
        clear() {
            for (const key of this.keys()) localStorage.removeItem(key);
        },
    };
}

// Model call results, so reruns of the same request cost nothing. A refused write returns false, which
// the pipeline counts and reports.
const cacheStore = makePrefixedStore(CONSTANTS.CACHE_KEY_PREFIX);

// Fetched threads by id, so reruns score the same comments; a live thread gains comments, which would

const snapshotStore = makePrefixedStore(CONSTANTS.THREAD_KEY_PREFIX);

// The OpenRouter key is held in this variable, gone on reload, unless "Remember in this browser" was

const KEY_SCOPE_MEMORY = 'held until reload';

}

function currentApiKey() {

}

function keyScopeText() {

}

// Takes a newly obtained key into localStorage or into memory, as the remember choice says.

    if (remember) {
        localStorage.setItem(CONSTANTS.STORAGE_KEY_OPENROUTER, key);

        memoryApiKey = key;

function forgetApiKey() {
    localStorage.removeItem(CONSTANTS.STORAGE_KEY_OPENROUTER);
    memoryApiKey = null;
    refreshKeyState();
}

const elements = {
    storyList: document.getElementById('story-list'),
    threadId: document.getElementById('thread-id'),
    minComments: document.getElementById('min-comments'),
    loadThread: document.getElementById('load-thread'),
    refreshThread: document.getElementById('refresh-thread'),
    shareRow: document.getElementById('share-row'),
    share: document.getElementById('share'),
